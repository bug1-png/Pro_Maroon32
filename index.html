<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maroon Sales Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6F4;
    --surface:#FFFFFF;
    --surface-2:#F4ECEA;
    --border:#E8DCDA;
    --ink:#241316;
    --ink-soft:#7C6367;
    --ink-faint:#A78E92;
    --accent:#8C2F3B;
    --accent-strong:#6B1F29;
    --accent-soft:#F6E5E7;
    --accent-contrast:#FFFFFF;

    --ok:#237A50;      --ok-bg:#E4F3EA;
    --vip:#0E7268;     --vip-bg:#DEF2EF;
    --warn:#A96A08;    --warn-bg:#FBEDD8;
    --info:#2158A0;    --info-bg:#E6EFFB;
    --muted:#5E5B62;   --muted-bg:#ECEAEC;
    --danger:#A6293B;  --danger-bg:#FAE6E9;
    --special:#5B4B8A; --special-bg:#ECE7F5;

    --shadow: 0 1px 2px rgba(36,19,22,.06), 0 6px 20px -8px rgba(36,19,22,.18);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1A1214;
      --surface:#231619;
      --surface-2:#2C1B1F;
      --border:#3C272B;
      --ink:#F4E9EA;
      --ink-soft:#C6ADB1;
      --ink-faint:#8C7276;
      --accent:#E68C99;
      --accent-strong:#F2AAB4;
      --accent-soft:#3A2226;
      --accent-contrast:#2A1417;

      --ok:#6BD79B;      --ok-bg:#163826;
      --vip:#5FDCCF;     --vip-bg:#0F3733;
      --warn:#F0B85B;    --warn-bg:#3A2C12;
      --info:#8FB8F2;    --info-bg:#1C2C45;
      --muted:#C3C0C7;   --muted-bg:#2C2A2F;
      --danger:#F2939F;  --danger-bg:#3A1D22;
      --special:#BDACEF; --special-bg:#2A2340;

      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1A1214;
    --surface:#231619;
    --surface-2:#2C1B1F;
    --border:#3C272B;
    --ink:#F4E9EA;
    --ink-soft:#C6ADB1;
    --ink-faint:#8C7276;
    --accent:#E68C99;
    --accent-strong:#F2AAB4;
    --accent-soft:#3A2226;
    --accent-contrast:#2A1417;

    --ok:#6BD79B;      --ok-bg:#163826;
    --vip:#5FDCCF;     --vip-bg:#0F3733;
    --warn:#F0B85B;    --warn-bg:#3A2C12;
    --info:#8FB8F2;    --info-bg:#1C2C45;
    --muted:#C3C0C7;   --muted-bg:#2C2A2F;
    --danger:#F2939F;  --danger-bg:#3A1D22;
    --special:#BDACEF; --special-bg:#2A2340;

    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Thai','IBM Plex Sans',system-ui,sans-serif;
    padding-inline:0;
  }
  h1,h2,h3,.font-display{ font-family:'Noto Serif Thai','Noto Serif',serif; }
  .num{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric: tabular-nums; }
  ::selection{ background:var(--accent-soft); color:var(--accent-strong); }

  /* ---------- layout shell ---------- */
  .app{ max-width:720px; margin-inline:auto; padding-inline:16px; }

  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    background:linear-gradient(180deg,var(--bg) 82%, transparent);
    padding-top:14px;
  }
  .brandrow{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand h1{ font-size:22px; font-weight:700; margin:0; letter-spacing:.2px; color:var(--ink); }
  .brand span.tag{ font-size:11px; font-weight:600; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:3px 9px; letter-spacing:.03em; }
  .updated{
    flex:none; display:flex; align-items:center; gap:5px;
    font-size:10px; line-height:1.35; color:var(--ink-faint); text-align:right;
  }
  .updated svg{ flex:none; opacity:.7; }
  .updated b{ color:var(--ink-soft); font-weight:600; }
  .subline{ font-size:12.5px; color:var(--ink-soft); margin:2px 0 12px; }
  .subline b{ color:var(--ink); font-weight:600; }

  .search-row{ display:flex; gap:8px; margin-bottom:10px; }
  .search-box{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:9px 14px; box-shadow:var(--shadow);
  }
  .search-box svg{ flex:none; opacity:.55; }
  .search-box input{
    border:none; outline:none; background:transparent; color:var(--ink);
    font:inherit; font-size:14px; width:100%;
  }
  .search-box input::placeholder{ color:var(--ink-faint); }
  .search-box button.clear{
    flex:none; border:none; background:none; color:var(--ink-faint); padding:2px;
    display:flex; cursor:pointer;
  }
  .filter-btn{
    flex:none; display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:9px 14px; font-size:13.5px; font-weight:600; color:var(--ink);
    box-shadow:var(--shadow); position:relative; cursor:pointer;
  }
  .filter-btn .dot{
    position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%;
    background:var(--accent); border:2px solid var(--bg); display:none;
  }
  .filter-btn.active .dot{ display:block; }

  .chipbar{
    display:flex; gap:7px; overflow-x:auto; padding-bottom:12px; margin:0 -16px 4px; padding-inline:16px;
    scrollbar-width:none;
  }
  .chipbar::-webkit-scrollbar{ display:none; }
  .chip{
    flex:none; font-size:13px; font-weight:600; color:var(--ink-soft);
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:7px 13px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip .n{ font-size:11px; font-weight:600; opacity:.75; }
  .chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
  .chip[aria-pressed="true"] .n{ opacity:.85; }

  .summary{
    display:flex; align-items:center; justify-content:space-between;
    font-size:12.5px; color:var(--ink-soft); padding:2px 2px 10px;
  }
  .summary b{ color:var(--ink); font-weight:700; }
  .sort-inline{ display:flex; align-items:center; gap:5px; color:var(--ink-soft); font-weight:600; }
  .sort-inline select{
    border:none; background:transparent; color:var(--ink); font:inherit; font-weight:600; font-size:12.5px;
  }

  /* ---------- room list ---------- */
  .list{ display:flex; flex-direction:column; gap:10px; padding-bottom:36px; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .card-head{
    display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer;
  }
  .unit-id{ flex:none; width:60px; text-align:center; }
  .unit-id .house{ font-size:14px; font-weight:700; font-family:'IBM Plex Mono',monospace; color:var(--ink); line-height:1.15; }
  .unit-id .loc{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }

  .unit-mid{ flex:1; min-width:0; }
  .unit-mid .row1{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .unit-mid .type{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .unit-mid .plan{ font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; }
  .unit-mid .row2{ font-size:12px; color:var(--ink-soft); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; }

  .badge{
    font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;
    letter-spacing:.01em;
  }

  .unit-price{ flex:none; text-align:right; }
  .unit-price .final{ font-size:16px; font-weight:700; color:var(--accent-strong); }
  .unit-price .net{ font-size:11px; color:var(--ink-soft); margin-top:2px; }

  .chev{ flex:none; width:18px; height:18px; color:var(--ink-faint); transition:transform .22s ease; }
  .card[data-open="true"] .chev{ transform:rotate(180deg); }

  .card-detail{
    display:grid; grid-template-rows:0fr; transition:grid-template-rows .25s ease;
  }
  .card[data-open="true"] .card-detail{ grid-template-rows:1fr; }
  .card-detail > div{ overflow:hidden; }
  .detail-inner{ padding:2px 14px 16px; border-top:1px dashed var(--border); margin-top:2px; }

  .ladder{ padding-top:12px; display:flex; flex-direction:column; gap:6px; }
  .ladder .li{ display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; gap:10px; }
  .ladder .li .k{ color:var(--ink-soft); }
  .ladder .li .v{ font-weight:600; color:var(--ink); flex:none; }
  .ladder .li.sub .k{ padding-left:12px; color:var(--ink-faint); }
  .ladder .li.sub .v{ color:var(--ink-soft); font-weight:500; }
  .ladder .li.neg .v::before{ content:"\2212 "; }
  .ladder .li.subtotal .k, .ladder .li.subtotal .v{ font-weight:700; color:var(--ink-soft); }
  .ladder hr{ border:none; border-top:1px solid var(--border); margin:2px 0; }
  .ladder .li.total .k, .ladder .li.total .v{ font-weight:700; color:var(--ink); font-size:13.5px; }
  .ladder .col-tag{ font-size:10px; color:var(--ink-faint); font-weight:500; }

  .sales-note{
    margin-top:10px; background:var(--surface-2); border-radius:var(--radius-md);
    padding:10px 12px; display:flex; gap:8px; align-items:flex-start;
  }
  .sales-note svg{ flex:none; color:var(--accent); margin-top:1px; }
  .sales-note .txt{ font-size:11.5px; color:var(--ink-soft); line-height:1.5; }
  .sales-note .txt b{ color:var(--ink); }

  .final-net{
    margin-top:10px; background:var(--accent-soft); border-radius:var(--radius-md);
    padding:11px 13px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .final-net .lab{ font-size:11.5px; font-weight:600; color:var(--accent-strong); }
  .final-net .lab small{ display:block; font-weight:500; font-size:10px; color:var(--ink-soft); margin-top:1px; }
  .final-net .amt{ font-size:19px; font-weight:700; color:var(--accent-strong); }

  .empty{ text-align:center; padding:54px 20px; color:var(--ink-soft); }
  .empty svg{ opacity:.4; margin-bottom:12px; }
  .empty h3{ font-size:16px; color:var(--ink); margin:0 0 6px; }
  .empty p{ font-size:13px; margin:0 0 14px; line-height:1.6; }
  .empty button.btn-ghost-2{
    border:1px solid var(--border); background:var(--surface); color:var(--ink); font:inherit; font-weight:600;
    font-size:13px; padding:8px 16px; border-radius:999px; cursor:pointer;
  }
  .empty button.link-btn{
    border:none; background:none; color:var(--accent); font:inherit; font-weight:700;
    font-size:13px; text-decoration:underline; cursor:pointer; padding:4px;
  }

  /* ---------- filter sheet ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(20,10,12,.42); backdrop-filter:blur(1px);
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:40;
  }
  .scrim[data-show="true"]{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    background:var(--surface); border-radius:20px 20px 0 0;
    box-shadow:0 -10px 40px rgba(0,0,0,.25);
    max-height:min(84vh, 720px); display:flex; flex-direction:column;
    transform:translateY(102%); transition:transform .28s cubic-bezier(.32,.72,0,1);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .sheet[data-show="true"]{ transform:translateY(0); }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 8px; flex:none;
  }
  .sheet-head .bar{ position:absolute; left:50%; top:8px; transform:translateX(-50%); width:36px; height:4px; border-radius:99px; background:var(--border); }
  .sheet-head h2{ font-size:16px; margin:0; }
  .sheet-head button{ border:none; background:none; color:var(--ink-soft); font:inherit; font-weight:600; font-size:13px; cursor:pointer; }
  .sheet-body{ overflow-y:auto; padding:6px 18px 18px; display:flex; flex-direction:column; gap:20px; }

  .fgroup h3{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);
    margin:0 0 9px;
  }
  .fgrid{ display:flex; flex-wrap:wrap; gap:7px; }
  .fchip{
    font-size:13px; font-weight:600; color:var(--ink); background:var(--surface-2); border:1px solid transparent;
    border-radius:10px; padding:7px 12px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .fchip[aria-pressed="true"]{ background:var(--accent); color:var(--accent-contrast); }
  .fchip.status-chip[aria-pressed="true"]{ background:var(--sc,var(--accent)); color:#fff; }
  .fchip .n{ font-size:10.5px; opacity:.7; }

  .range-wrap{ padding:6px 4px 0; }
  .range-vals{ display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:8px; font-family:'IBM Plex Mono',monospace; }
  .range-track{ position:relative; height:34px; }
  .range-track .rail{ position:absolute; top:15px; left:0; right:0; height:4px; border-radius:99px; background:var(--border); }
  .range-track .fill{ position:absolute; top:15px; height:4px; border-radius:99px; background:var(--accent); }
  .range-track input[type=range]{
    position:absolute; top:0; left:0; width:100%; margin:0; height:34px; background:none;
    -webkit-appearance:none; appearance:none; pointer-events:none;
  }
  .range-track input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; pointer-events:auto; width:20px; height:20px; border-radius:50%;
    background:var(--surface); border:3px solid var(--accent); box-shadow:var(--shadow); cursor:grab; margin-top:0;
  }
  .range-track input[type=range]::-moz-range-thumb{
    pointer-events:auto; width:20px; height:20px; border-radius:50%;
    background:var(--surface); border:3px solid var(--accent); box-shadow:var(--shadow); cursor:grab;
  }
  .range-track input[type=range]::-webkit-slider-runnable-track{ background:transparent; }
  .range-track input[type=range]::-moz-range-track{ background:transparent; }

  .sheet-foot{
    flex:none; display:flex; gap:10px; padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--border);
  }
  .btn-ghost{
    flex:none; border:1px solid var(--border); background:var(--surface); color:var(--ink);
    font:inherit; font-weight:600; font-size:13.5px; padding:12px 16px; border-radius:12px; cursor:pointer;
  }
  .btn-solid{
    flex:1; border:none; background:var(--accent); color:var(--accent-contrast);
    font:inherit; font-weight:700; font-size:14px; padding:12px 16px; border-radius:12px; cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){
    .card-detail, .chev, .sheet{ transition:none !important; }
  }

  @media (min-width:600px){
    .list{ display:grid; grid-template-columns:1fr 1fr; }
  }
</style>

<div class="app">
  <div class="topbar">
    <div class="brandrow">
      <div class="brand">
        <h1>MAROON</h1>
        <span class="tag">Pricelist 2026</span>
      </div>
      <div class="updated">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>อัปเดตข้อมูล<br><b>20 ก.ย. 2569</b></span>
      </div>
    </div>
    <p class="subline">ห้องว่างพร้อมขาย <b id="statAvail">-</b> จากทั้งหมด <b id="statTotal">-</b> ยูนิต · อัปเดตราคา ณ ปีบัญชี 2026</p>

    <div class="search-row">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="text" inputmode="search" placeholder="พิมพ์บ้านเลขที่ หรือเลขที่แปลงเพื่อค้นหา">
        <button class="clear" id="clearSearch" type="button" hidden aria-label="ล้างคำค้นหา">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <button class="filter-btn" id="openFilter" aria-haspopup="dialog">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        ตัวกรอง<span class="dot"></span>
      </button>
    </div>

    <div class="chipbar" id="quickChips"></div>
  </div>

  <div class="summary">
    <span>พบ <b id="resultCount">-</b> ห้อง</span>
    <span class="sort-inline">
      เรียงตาม
      <select id="sortSelect">
        <option value="default">ลำดับแปลง</option>
        <option value="price-asc">ราคาต่ำ → สูง</option>
        <option value="price-desc">ราคาสูง → ต่ำ</option>
        <option value="floor-asc">ชั้นน้อย → มาก</option>
        <option value="floor-desc">ชั้นมาก → น้อย</option>
        <option value="area-desc">พื้นที่มาก → น้อย</option>
      </select>
    </span>
  </div>

  <div class="list" id="roomList"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="filterSheet" role="dialog" aria-label="ตัวกรอง">
  <div class="sheet-head">
    <span class="bar"></span>
    <h2>ตัวกรองห้อง</h2>
    <button id="resetFilters" type="button">ล้างทั้งหมด</button>
  </div>
  <div class="sheet-body">
    <div class="fgroup">
      <h3>ตึก</h3>
      <div class="fgrid" id="fTower"></div>
    </div>
    <div class="fgroup">
      <h3>ชั้น</h3>
      <div class="fgrid" id="fFloor"></div>
    </div>
    <div class="fgroup">
      <h3>สถานะห้อง</h3>
      <div class="fgrid" id="fStatus"></div>
    </div>
    <div class="fgroup">
      <h3>ประเภทห้อง</h3>
      <div class="fgrid" id="fType"></div>
    </div>
    <div class="fgroup">
      <h3>วิว</h3>
      <div class="fgrid" id="fView"></div>
    </div>
    <div class="fgroup">
      <h3>ทิศ</h3>
      <div class="fgrid" id="fDir"></div>
    </div>
    <div class="fgroup">
      <h3>ช่วงราคา Net สุดท้าย (บาท)</h3>
      <div class="range-wrap">
        <div class="range-vals"><span id="priceMinLabel">-</span><span id="priceMaxLabel">-</span></div>
        <div class="range-track">
          <div class="rail"></div>
          <div class="fill" id="rangeFill"></div>
          <input type="range" id="priceMin">
          <input type="range" id="priceMax">
        </div>
      </div>
    </div>
  </div>
  <div class="sheet-foot">
    <button class="btn-ghost" id="closeFilter" type="button">ปิด</button>
    <button class="btn-solid" id="applyFilter" type="button">แสดงผล <span id="applyCount">-</span> ห้อง</button>
  </div>

<script>
(function(){
  "use strict";
  var ROOMS = JSON.parse(document.getElementById('room-data').textContent);
  /* units already transferred to a new owner must never surface to sales again */
  ROOMS = ROOMS.filter(function(r){ return r.status !== 'โอนแล้ว'; });

  var STATUS_META = {
    'ห้องว่าง':          {bucket:'available',  label:'ห้องว่าง',        v:'--ok',      bg:'--ok-bg'},
    'ห้องว่าง VIP':       {bucket:'availableVip',label:'ว่าง · VIP',     v:'--vip',     bg:'--vip-bg'},
    'จอง':               {bucket:'reserved',   label:'จอง',            v:'--warn',    bg:'--warn-bg'},
    'ล็อคนุ้ย':           {bucket:'reserved',   label:'ล็อค',           v:'--warn',    bg:'--warn-bg'},
    'ยังไม่โอน':          {bucket:'inprocess',  label:'รอโอน',          v:'--info',    bg:'--info-bg'},
    'นัดโอนแล้ว':         {bucket:'inprocess',  label:'นัดโอนแล้ว',      v:'--info',    bg:'--info-bg'},
    'โอนแล้ว':            {bucket:'sold',       label:'โอนแล้ว',         v:'--muted',   bg:'--muted-bg'},
    'รอยกเลิก Sale':      {bucket:'issue',      label:'รอยกเลิก (Sale)', v:'--danger',  bg:'--danger-bg'},
    'รอยกเลิก CS':        {bucket:'issue',      label:'รอยกเลิก (CS)',   v:'--danger',  bg:'--danger-bg'},
    'แนวโน้มไม่โอน/CS':    {bucket:'issue',      label:'เสี่ยงไม่โอน (CS)',v:'--danger', bg:'--danger-bg'},
    'แนวโน้มไม่โอน/Sale':  {bucket:'issue',      label:'เสี่ยงไม่โอน (Sale)',v:'--danger',bg:'--danger-bg'},
    'Deviate':            {bucket:'issue',      label:'Deviate',        v:'--danger',  bg:'--danger-bg'},
    'ห้องตัวอย่าง':        {bucket:'special',    label:'ห้องตัวอย่าง',    v:'--special', bg:'--special-bg'},
    'ห้องเซลล์':          {bucket:'special',    label:'ห้องเซลล์',      v:'--special', bg:'--special-bg'},
    'ห้องแต่งขาย':         {bucket:'special',    label:'แต่งขาย',        v:'--special', bg:'--special-bg'},
    'ห้อง MI':            {bucket:'special',    label:'ห้อง MI',        v:'--special', bg:'--special-bg'},
    'พร้อมผู้เช่า':        {bucket:'special',    label:'พร้อมผู้เช่า',    v:'--special', bg:'--special-bg'},
    'ห้องเก็บของ':         {bucket:'special',    label:'ห้องเก็บของ',    v:'--special', bg:'--special-bg'}
  };
  function statusMeta(s){ return STATUS_META[s] || {bucket:'special', label:s||'-', v:'--muted', bg:'--muted-bg'}; }

  var QUICK = [
    {key:'all', label:'ทั้งหมด', test:function(){return true;}},
    {key:'available', label:'ว่าง', test:function(r){var b=statusMeta(r.status).bucket; return b==='available'||b==='availableVip';}},
    {key:'reserved', label:'จอง/ล็อค', test:function(r){return statusMeta(r.status).bucket==='reserved';}},
    {key:'inprocess', label:'ระหว่างโอน', test:function(r){return statusMeta(r.status).bucket==='inprocess';}},
    {key:'issue', label:'ติดปัญหา', test:function(r){return statusMeta(r.status).bucket==='issue';}},
    {key:'special', label:'อื่นๆ', test:function(r){return statusMeta(r.status).bucket==='special';}}
  ];

  function uniq(arr){ return arr.filter(function(v,i){return arr.indexOf(v)===i;}); }
  var TOWERS = uniq(ROOMS.map(function(r){return r.tower;})).sort();
  var FLOORS = uniq(ROOMS.map(function(r){return r.floor;})).sort(function(a,b){return (+a)-(+b);});
  var TYPES = uniq(ROOMS.map(function(r){return r.type;}));
  var VIEWS = uniq(ROOMS.map(function(r){return r.view;}));
  var DIRS = uniq(ROOMS.map(function(r){return r.dir;}));
  var STATUSES = uniq(ROOMS.map(function(r){return r.status;}));
  var PRICE_MIN = Math.min.apply(null, ROOMS.map(function(r){return r.finalNet;}));
  var PRICE_MAX = Math.max.apply(null, ROOMS.map(function(r){return r.finalNet;}));

  var state = {
    q:'', quick:null, towers:[], floors:[], statuses:[], types:[], views:[], dirs:[],
    priceMin:PRICE_MIN, priceMax:PRICE_MAX, sort:'default', openId:null,
    forceShow:false, lastSingleId:null
  };

  function fmtBaht(n){ if(n==null) return '-'; return Math.round(n).toLocaleString('th-TH'); }
  function fmtArea(n){ if(n==null) return '-'; return (Math.round(n*100)/100).toLocaleString('th-TH'); }

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html!=null) e.innerHTML = html;
    return e;
  }

  function multiToggle(list, val){
    var i = list.indexOf(val);
    if(i>-1) list.splice(i,1); else list.push(val);
  }

  /* ---------- quick chips ---------- */
  var quickChipsEl = document.getElementById('quickChips');
  function renderQuickChips(){
    quickChipsEl.innerHTML='';
    QUICK.forEach(function(q){
      var count = ROOMS.filter(q.test).length;
      var b = el('button','chip', q.label+' <span class="n">'+count+'</span>');
      b.setAttribute('aria-pressed', state.quick===q.key ? 'true':'false');
      b.addEventListener('click', function(){
        state.quick = (state.quick===q.key) ? null : q.key;
        renderQuickChips(); applyAndRender();
      });
      quickChipsEl.appendChild(b);
    });
  }

  /* ---------- filter sheet builders ---------- */
  function buildToggleGroup(containerId, values, selectedArr, labelFn, statusColor){
    var c = document.getElementById(containerId);
    c.innerHTML='';
    values.forEach(function(v){
      var meta = statusColor ? statusMeta(v) : null;
      var b = el('button','fchip'+(statusColor?' status-chip':''), labelFn(v));
      if(meta){ b.style.setProperty('--sc', 'var('+meta.v+')'); }
      b.setAttribute('aria-pressed', selectedArr.indexOf(v)>-1 ? 'true':'false');
      b.addEventListener('click', function(){
        multiToggle(selectedArr, v);
        b.setAttribute('aria-pressed', selectedArr.indexOf(v)>-1 ? 'true':'false');
        updateApplyCount(); syncFilterDot();
      });
      c.appendChild(b);
    });
  }

  function countForStatus(v){ return ROOMS.filter(function(r){return r.status===v;}).length; }

  function renderFilterSheet(){
    buildToggleGroup('fTower', TOWERS, state.towers, function(v){return 'ตึก '+v;});
    buildToggleGroup('fFloor', FLOORS, state.floors, function(v){return 'ชั้น '+v;});
    buildToggleGroup('fStatus', STATUSES, state.statuses, function(v){
      var m = statusMeta(v); return m.label+' <span class="n">'+countForStatus(v)+'</span>';
    }, true);
    buildToggleGroup('fType', TYPES, state.types, function(v){return v;});
    buildToggleGroup('fView', VIEWS, state.views, function(v){return v==='นอก' ? 'วิวนอก' : 'วิวใน';});
    buildToggleGroup('fDir', DIRS, state.dirs, function(v){return 'ทิศ'+v;});
    initRange();
  }

  /* ---------- price range slider ---------- */
  var minInput = document.getElementById('priceMin');
  var maxInput = document.getElementById('priceMax');
  function initRange(){
    [minInput,maxInput].forEach(function(inp){
      inp.min = Math.floor(PRICE_MIN/1000)*1000;
      inp.max = Math.ceil(PRICE_MAX/1000)*1000;
      inp.step = 1; /* fine step so the true min/max data points stay reachable (a coarser step snaps and silently excludes edge units) */
    });
    minInput.value = state.priceMin;
    maxInput.value = state.priceMax;
    updateRangeUI();
  }
  function updateRangeUI(){
    var lo = Math.min(+minInput.value, +maxInput.value);
    var hi = Math.max(+minInput.value, +maxInput.value);
    state.priceMin = lo; state.priceMax = hi;
    document.getElementById('priceMinLabel').textContent = fmtBaht(lo)+' ฿';
    document.getElementById('priceMaxLabel').textContent = fmtBaht(hi)+' ฿';
    var span = (+maxInput.max)-(+maxInput.min) || 1;
    var l = ((lo-(+maxInput.min))/span)*100;
    var r = ((hi-(+maxInput.min))/span)*100;
    var fill = document.getElementById('rangeFill');
    fill.style.left = l+'%'; fill.style.right = (100-r)+'%';
    updateApplyCount();
  }
  minInput.addEventListener('input', updateRangeUI);
  maxInput.addEventListener('input', updateRangeUI);

  /* ---------- filtering ---------- */
  function hasActiveQuery(){
    return !!state.q.trim() || !!state.quick ||
      state.towers.length>0 || state.floors.length>0 || state.statuses.length>0 ||
      state.types.length>0 || state.views.length>0 || state.dirs.length>0 ||
      state.priceMin>PRICE_MIN || state.priceMax<PRICE_MAX || state.forceShow;
  }

  function matches(r){
    if(state.quick){
      var qd = QUICK.find(function(q){return q.key===state.quick;});
      if(qd && !qd.test(r)) return false;
    }
    if(state.towers.length && state.towers.indexOf(r.tower)===-1) return false;
    if(state.floors.length && state.floors.indexOf(r.floor)===-1) return false;
    if(state.statuses.length && state.statuses.indexOf(r.status)===-1) return false;
    if(state.types.length && state.types.indexOf(r.type)===-1) return false;
    if(state.views.length && state.views.indexOf(r.view)===-1) return false;
    if(state.dirs.length && state.dirs.indexOf(r.dir)===-1) return false;
    if(r.finalNet < state.priceMin || r.finalNet > state.priceMax) return false;
    if(state.q){
      var hay = (r.house+' '+r.plot+' '+r.plan+' '+r.tower+r.floor+r.pos).toLowerCase();
      if(hay.indexOf(state.q.toLowerCase())===-1) return false;
    }
    return true;
  }

  function sortRooms(list){
    var s = state.sort;
    var copy = list.slice();
    if(s==='price-asc') copy.sort(function(a,b){return a.finalNet-b.finalNet;});
    else if(s==='price-desc') copy.sort(function(a,b){return b.finalNet-a.finalNet;});
    else if(s==='floor-asc') copy.sort(function(a,b){return (+a.floor)-(+b.floor) || a.pos.localeCompare(b.pos);});
    else if(s==='floor-desc') copy.sort(function(a,b){return (+b.floor)-(+a.floor) || a.pos.localeCompare(b.pos);});
    else if(s==='area-desc') copy.sort(function(a,b){return b.area-a.area;});
    else copy.sort(function(a,b){return a.no-b.no;});
    return copy;
  }

  function updateApplyCount(){
    var n = ROOMS.filter(matches).length;
    document.getElementById('applyCount').textContent = n;
  }

  function syncFilterDot(){
    var active = state.towers.length||state.floors.length||state.statuses.length||state.types.length||state.views.length||state.dirs.length||state.priceMin>PRICE_MIN||state.priceMax<PRICE_MAX;
    document.getElementById('openFilter').classList.toggle('active', !!active);
  }

  /* ---------- render list ---------- */
  var listEl = document.getElementById('roomList');

  function ladderRow(k,v,opts){
    opts = opts||{};
    return '<div class="li'+(opts.sub?' sub':'')+(opts.neg?' neg':'')+(opts.total?' total':'')+'">'+
      '<span class="k">'+k+'</span><span class="v num">'+v+'</span></div>';
  }

  function cardHTML(r){
    var meta = statusMeta(r.status);
    var open = state.openId === r.no;
    var badge = '<span class="badge" style="color:var('+meta.v+');background:var('+meta.bg+')">'+meta.label+'</span>';
    var head = ''+
      '<div class="unit-id"><div class="house num">'+r.plot+'</div><div class="loc">'+r.house+'</div></div>'+
      '<div class="unit-mid">'+
        '<div class="row1"><span class="type">'+r.type+'</span><span class="plan">'+(r.plan||'')+'</span></div>'+
        '<div class="row2"><span>ตึก '+r.tower+' ชั้น '+r.floor+'-'+r.pos+'</span><span>'+fmtArea(r.area)+' ตร.ม.</span><span>วิว'+(r.view==='นอก'?'นอก':'ใน')+' · ทิศ'+r.dir+'</span></div>'+
        '<div class="row2">'+badge+'</div>'+
      '</div>'+
      '<div class="unit-price"><div class="final num">'+fmtBaht(r.listPrice)+'</div><div class="net num">สุทธิ '+fmtBaht(r.netAfterPro)+'</div></div>'+
      '<svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    var ladder = '<div class="ladder">'+
      ladderRow('ราคาขาย', fmtBaht(r.listPrice)+' ฿')+
      ladderRow('ส่วนลดลงทะเบียน (PRO1)', fmtBaht(r.pro1)+' ฿', {sub:true,neg:true})+
      ladderRow('อยู่ฟรี 2 ปี ล้านละ 2,500 บาท LH (PRO2)', fmtBaht(r.pro2)+' ฿', {sub:true,neg:true})+
      ladderRow('เครื่องใช้ไฟฟ้า 9 รายการ (PRO3)', fmtBaht(r.pro3)+' ฿', {sub:true,neg:true})+
      ladderRow('รวมส่วนลด PRO #1-3', fmtBaht(r.proTotal)+' ฿', {subtotal:true})+
      '<hr>'+
      ladderRow('ราคาสุทธิ (หลังโปรโมชั่น)', fmtBaht(r.netAfterPro)+' ฿', {total:true})+
    '</div>'+
    '<div class="sales-note">'+
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 5.5L20 9l-4.4 3.8L17 19l-5-3.3L7 19l1.4-6.2L4 9l5.6-1.5L12 2z" fill="currentColor"/></svg>'+
      '<div class="txt"><b>ส่วนลดเพิ่มเติมสำหรับทีมขาย (On Hand)</b> — ใช้เจรจาต่อรองกับลูกค้าเป็นรายกรณี ไม่ต้องเสนอทันทีจนกว่าจำเป็น</div>'+
    '</div>'+
    '<div class="ladder" style="padding-top:8px">'+
      ladderRow('ส่วนลด B2B / ราชการ กทม. (On Hand #1)', fmtBaht(r.onHand1)+' ฿', {sub:true,neg:true})+
      ladderRow('ส่วนกลางปีที่ 2 (On Hand #2)', fmtBaht(r.onHand2)+' ฿', {sub:true,neg:true})+
      ladderRow('รวม On Hand #1-2', fmtBaht(r.onHandTotal)+' ฿', {subtotal:true})+
      ladderRow('มูลค่าฟรีค่าใช้จ่ายโอน 7 รายการ', fmtBaht(r.freeTransferValue)+' ฿', {neg:true})+
      '<hr>'+
      ladderRow('รวมส่วนลดทั้งหมด', fmtBaht(r.totalDiscount)+' ฿', {total:true})+
    '</div>'+
    '<div class="final-net">'+
      '<div class="lab">ราคา Net สุดท้าย<small>ราคาต่ำสุดที่เสนอลูกค้าได้ ห้ามลดเพิ่ม</small></div>'+
      '<div class="amt num">'+fmtBaht(r.finalNet)+' ฿</div>'+
    '</div>';

    var card = el('div','card');
    card.dataset.open = open ? 'true':'false';
    card.dataset.id = r.no;
    var headEl = el('div','card-head'); headEl.innerHTML = head;
    headEl.addEventListener('click', function(){
      state.openId = (state.openId===r.no) ? null : r.no;
      render();
    });
    var detailEl = el('div','card-detail');
    var inner = el('div'); var innerInner = el('div','detail-inner', ladder);
    inner.appendChild(innerInner);
    detailEl.appendChild(inner);
    card.appendChild(headEl);
    card.appendChild(detailEl);
    return card;
  }

  function render(){
    document.getElementById('statTotal').textContent = ROOMS.length;
    document.getElementById('statAvail').textContent = ROOMS.filter(function(r){var b=statusMeta(r.status).bucket; return b==='available'||b==='availableVip';}).length;

    listEl.innerHTML='';
    var summaryEl = document.querySelector('.summary');

    if(!hasActiveQuery()){
      state.lastSingleId = null;
      summaryEl.style.display='none';
      var prompt = el('div','empty',
        '<svg width="42" height="42" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'+
        '<h3>ค้นหาห้องที่ต้องการ</h3>'+
        '<p>พิมพ์บ้านเลขที่ หรือเลขที่แปลงด้านบน<br>หรือแตะสถานะ/ตัวกรอง เพื่อดูรายการห้อง</p>'
      );
      var showAllBtn = el('button','link-btn', 'ดูห้องทั้งหมด ('+ROOMS.length+' ห้อง)');
      showAllBtn.addEventListener('click', function(){ state.forceShow=true; render(); });
      prompt.appendChild(showAllBtn);
      listEl.style.display='block';
      listEl.appendChild(prompt);
      return;
    }

    var filtered = ROOMS.filter(matches);
    var sorted = sortRooms(filtered);
    document.getElementById('resultCount').textContent = sorted.length;
    summaryEl.style.display='';

    if(!sorted.length){
      state.lastSingleId = null;
      var e = el('div','empty',
        '<svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'+
        '<h3>ไม่พบห้องที่ตรงกัน</h3>'+
        '<p>ลองพิมพ์คำค้นหาอื่น หรือปรับตัวกรองใหม่</p>'
      );
      var btn = el('button','btn-ghost-2', 'ล้างการค้นหาทั้งหมด');
      btn.addEventListener('click', clearAll);
      e.appendChild(btn);
      listEl.style.display='block';
      listEl.appendChild(e);
      return;
    }

    if(sorted.length===1){
      if(state.lastSingleId !== sorted[0].no){
        state.openId = sorted[0].no;
        state.lastSingleId = sorted[0].no;
      }
    } else {
      state.lastSingleId = null;
    }

    listEl.style.display='';
    sorted.forEach(function(r){ listEl.appendChild(cardHTML(r)); });
  }

  function applyAndRender(){ syncFilterDot(); render(); }

  function clearAll(){
    state.towers=[]; state.floors=[]; state.statuses=[]; state.types=[]; state.views=[]; state.dirs=[];
    state.priceMin=PRICE_MIN; state.priceMax=PRICE_MAX; state.quick=null; state.q='';
    state.forceShow=false; state.lastSingleId=null; state.openId=null;
    document.getElementById('searchInput').value='';
    document.getElementById('clearSearch').hidden = true;
    renderQuickChips(); renderFilterSheet(); applyAndRender();
  }

  /* ---------- events ---------- */
  var searchInputEl = document.getElementById('searchInput');
  var clearSearchBtn = document.getElementById('clearSearch');
  searchInputEl.addEventListener('input', function(e){
    state.q = e.target.value;
    clearSearchBtn.hidden = !state.q;
    render();
  });
  clearSearchBtn.addEventListener('click', function(){
    state.q=''; searchInputEl.value=''; clearSearchBtn.hidden=true; searchInputEl.focus(); render();
  });
  document.getElementById('sortSelect').addEventListener('change', function(e){
    state.sort = e.target.value; render();
  });

  var scrim = document.getElementById('scrim');
  var sheet = document.getElementById('filterSheet');
  function openSheet(){
    renderFilterSheet(); updateApplyCount();
    scrim.dataset.show='true'; sheet.dataset.show='true';
  }
  function closeSheet(){ scrim.dataset.show='false'; sheet.dataset.show='false'; }
  document.getElementById('openFilter').addEventListener('click', openSheet);
  document.getElementById('closeFilter').addEventListener('click', closeSheet);
  document.getElementById('applyFilter').addEventListener('click', function(){ state.forceShow=true; closeSheet(); applyAndRender(); });
  document.getElementById('resetFilters').addEventListener('click', clearAll);
  scrim.addEventListener('click', closeSheet);

  renderQuickChips();
  render();
})();
</script>
